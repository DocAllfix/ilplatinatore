# Limiti di Apache per il CMS su Hetzner CAX11 (2 processori, 4 GB).
# Il valore di fabbrica (150 processi) lasciava aprire decine di processi PHP da ~100 MB ciascuno:
# sotto carico la memoria finiva e WordPress si fermava del tutto (17/10/2026, carico 99).
# Con 12 processi al massimo le richieste in piu' aspettano in coda il loro turno: piu' lente, ma
# il server resta vivo, e chi scrive in wp-admin continua a lavorare.
<IfModule mpm_prefork_module>
	StartServers             3
	MinSpareServers          2
	MaxSpareServers          6
	MaxRequestWorkers        12
	MaxConnectionsPerChild   500
</IfModule>
