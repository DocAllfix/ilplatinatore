# Sorveglianza del sito di prova e del CMS (17/10/2026, dopo l'incidente: ve ne siete accorti voi,
# non un sistema). Ogni 10 minuti controlla che sito, immagini e CMS rispondano davvero. Se un
# controllo fallisce, il lavoro fallisce e GitHub manda un'email al proprietario del repository.
#
# E' un primo livello gratuito, senza account nuovi. Non sostituisce un monitor dedicato
# (UptimeRobot o Better Stack: avviso sul telefono entro un minuto), previsto nel piano di stabilita'
# (docs/piano-stabilita.md). GitHub non garantisce l'orario esatto dei lavori pianificati: puo'
# ritardarli di qualche minuto.

name: Sorveglianza

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      rompi:
        description: "Aggiunge un controllo che deve fallire (per vedere la sorveglianza diventare rossa)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  controlla:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITO: https://www.ilplatinatore.it
      CMS: https://cms.ilplatinatore.it
    steps:
      - uses: actions/checkout@v4
      - name: Sito, immagini e CMS
        run: bash scripts/qa/sorveglia.sh ${{ inputs.rompi && 'rompi' || '' }}
