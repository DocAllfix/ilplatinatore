# Controlli dopo ogni pubblicazione (Fase 4). Vercel non avvisa GitHub delle sue pubblicazioni, quindi
# a ogni push su main il lavoro aspetta che il sito di prova serva la stessa versione del codice (meta
# «platinatore-versione» = commit), poi lancia i controlli veloci. Se uno fallisce, o se la
# pubblicazione non arriva in 25 minuti, il lavoro fallisce e GitHub manda un'email.

name: Dopo la pubblicazione

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  controlla:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Attesa della pubblicazione su Vercel
        run: |
          for i in $(seq 1 50); do
            v=$(curl -s -m 20 https://www.ilplatinatore.it/ | grep -o 'name="platinatore-versione" content="[0-9a-f]*"' | grep -o '[0-9a-f]\{40\}' || true)
            if [ "$v" = "${GITHUB_SHA}" ]; then echo "pubblicata la versione ${GITHUB_SHA:0:7}"; exit 0; fi
            sleep 30
          done
          echo "::error::Dopo 25 minuti il sito non serve ancora la versione ${GITHUB_SHA:0:7}"; exit 1
      - name: Sito, immagini e CMS
        run: bash scripts/qa/sorveglia.sh
